    <script type="text/javascript">
     


        function FloatPanel_AyohaeWallet_getBillTransaction(billCode, billexternalid) {
          

            $.ajax({

                url: "https://versilani.com/CRMOBILEAPI/PaymentGateway/PaymentGatewayGetBillTransaction?billCode=" + billCode + "&billpaymentStatus=1",

                    var obj = JSON.stringify(result);

                 const txt =stred.replaceAll('\\', '');
                 const objt = JSON.parse(txt);                  
               
                   


                    var no=4;

                        var x = setInterval(function() {

                                    dataType: 'json',
                                    type: 'post',
                                    contentType: 'application/json',                                   
                                    data: JSON.stringify({
                                        "billName": objt.billName, "billDescription": objt.billDescription, "billTo": objt.billTo, "billEmail": objt.billEmail, "billPhone": objt.billPhone, "billStatus": objt.billStatus, "billpaymentStatus": objt.billpaymentStatus,
                                        "billpaymentChannel":objt.billpaymentChannel,"billpaymentAmount":objt.billpaymentAmount,"billpaymentInvoiceNo":objt.billpaymentInvoiceNo,"billSplitPayment":objt.billSplitPayment,"billSplitPaymentArgs":objt.billSplitPaymentArgs,"billpaymentSettlement":objt.billpaymentSettlement,
                                        "billpaymentSettlementDate": objt.billpaymentSettlementDate, "SettlementReferenceNo": objt.SettlementReferenceNo, "billPaymentDate": objt.billPaymentDate, "billExternalReferenceNo": billexternalid, "billCode": billCode
                                    }),
                                    processData: false,
                                    success: function (data, textStatus, jQxhr) {
                                        window.close();
                                       // localStorage.setItem("Externalvar_CheckPaymentGatewayTransaction", "Done");
                                     
                                        //var nor = 0;


                                        //var xxr = setInterval(function () {
                                        //    nor = nor + 1;

                                        //    if (nor == 5) {
                                                
                                        //       // window.close();

                                        //    }
                                          

                                        //}, 1000);
                                       // window.localStorage.setItem('Externalvar_CheckPaymentGatewayTransaction', "Done");
                                       
                                    },
                                    error: function (jqXhr, textStatus, errorThrown) {
                                        alert(errorThrown);
                                    }
                                });


                            }
                        }, 1000);


                   
                }
            });



        }
    </script>
